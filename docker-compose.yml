# ============================================================================
# MacAttack - Docker Compose for Synology NAS DS918+ *and* Raspberry Pi 4
# ============================================================================
# IMPORTANT: Nothing is compiled on the host anymore!
#
# The Docker image is built by GitHub Actions on every push to the `main`
# branch and published to GitHub Container Registry:
#
#     ghcr.io/birdy1974/macattack
#
# It is a multi-platform image (linux/amd64 + linux/arm64), so this one
# file works unchanged on both:
#
#   * Synology DS918+  -> x86_64  (Intel Celeron J3455)
#   * Raspberry Pi 4    -> aarch64 (64-bit Raspberry Pi OS)
#
# Docker selects the matching architecture automatically on pull, so no
# `platform:` line and no per-host file is needed.
#
# INSTALLATION STEPS (identical on NAS and Pi):
# 1. Copy ONLY this file (and optionally update.sh) to the host, e.g.:
#      NAS: /volume1/docker/mac-attack/
#      Pi:  ~/mac-attack/
# 2. SSH into the host:  ssh <user>@<HOST-IP>
# 3. cd into that directory
# 4. Create the thumbnail folder ON THE HOST HARDDISK (as the same user that
#    owns this directory, so the container — running as ${PUID:-1026} —
#    can write into it):
#      mkdir -p data/thumbnails
#    Do this BEFORE the first start: if ./data does not exist yet, Docker
#    auto-creates it owned by root and the app cannot write thumbnails
#    into it (they fall back to /tmp inside the container instead).
# 5. docker compose up -d        (or: docker-compose up -d)
# 6. Open in your browser:  http://<HOST-IP>:3099
#
# UPDATING TO THE LATEST VERSION:
#    docker compose pull && docker compose up -d
#    (or run ./update.sh)
#
# The repository is public, so the image can be pulled anonymously.
# If you make the repository/package private later, log in first:
#    echo "<PERSONAL-ACCESS-TOKEN>" | docker login ghcr.io -u <GITHUB-USER> --password-stdin
# ============================================================================

services:
  # PostgreSQL Database
  # postgres:16-alpine ships linux/amd64 and linux/arm64 builds, so the same
  # tag works on the NAS and on the Pi.
  db:
    image: postgres:16-alpine
    container_name: mac-attack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: macattack
      POSTGRES_PASSWORD: macattack_secret_pw
      POSTGRES_DB: macattack_db
    volumes:
      - mac-attack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macattack -d macattack_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MacAttack Web Application
  # Pre-built multi-arch image from GitHub Container Registry
  # (compiled by GitHub Actions)
  app:
    image: ghcr.io/birdy1974/macattack:latest
    container_name: mac-attack
    # The app runs as this uid:gid (Synology default 1026:100; on the Pi set
    # PUID/PGID to your user's ids, e.g. `id` -> usually 1000:1000). The
    # host ./data folder below must be writable by these ids or thumbnails
    # cannot be saved on the host harddisk.
    user: "${PUID:-1026}:${PGID:-100}"
    restart: unless-stopped
    ports:
      - "3099:3000"
    environment:
      DATABASE_URL: postgresql://macattack:macattack_secret_pw@db:5432/macattack_db
      NODE_ENV: production
      # Captured stream thumbnails generated by the bundled FFmpeg.
      MACATTACK_DATA_DIR: /app/data
    volumes:
      # Captured thumbnails on the HOST HARDDISK: this bind-mounts ./data
      # (the folder next to this docker-compose.yml) at /app/data, so frames
      # appear in ./data/thumbnails on the host — NAS: /volume1/docker/mac-attack/data/thumbnails,
      # Pi: ~/mac-attack/data/thumbnails, i.e. mac-attack\data\thumbnails
      # when viewed from Windows. Thumbnails are kept across container
      # updates until the next new search clears them.
      # This MUST stay a bind mount (./data:...), not a Docker-managed named
      # volume: a named volume hides the files in Docker's own storage where
      # no host folder ever shows them.
      # ./data must be writable by the container user above
      # (${PUID:-1026}:${PGID:-100}): create it as that user (install step 4)
      # or chown it:  sudo chown -R ${PUID:-1026}:${PGID:-100} ./data
      # If it is not writable, startup logs say so, writes fall back to
      # /tmp/macattack-thumbnails *inside* the container, and ./data/thumbnails
      # stays empty — see the scan log / Host capabilities panel.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    # FFmpeg is included in the published amd64 + arm64 image, so picture
    # checks, FPS/bitrate profiling, and thumbnails work without host mounts.
    # Do NOT set FFMPEG_PATH here: the app finds the bundled binary on PATH,
    # and a wrong override only hides it (local source runs are the exception).
    # If the dashboard's Host capabilities panel reports "ffmpeg: not found",
    # this container is running an older image — pull the latest one:
    #   docker compose pull app && docker compose up -d   (or ./update.sh)
    # Optional Synology DS918+ VAAPI mapping lives in docker-compose.vaapi.yml;
    # the app uses software decoding automatically when VAAPI is unavailable.

volumes:
  mac-attack-pgdata:
    driver: local
  # Note: no `mac-attack-data` volume anymore — thumbnails bind-mount to
  # ./data on the host harddisk (see the app volumes above). An old
  # mac-attack-data volume left over from previous versions is unused and
  # can be removed with:  docker volume rm <project>_mac-attack-data
